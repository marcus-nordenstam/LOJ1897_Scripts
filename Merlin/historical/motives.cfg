# ----------------------------------------------------------------------------
# motives.cfg - motive vocabulary + driver matrix for the historical sim.
#
# An NPC's *motives* are derived from their *situations* (computed each tick
# in run_situation_pass), their *attitudes* (toward other npcs), recent
# *emotions*, and their static *traits* (dark tetrad, charisma, intelligence).
#
# Crime/social templates declare which motives are eligible to drive their
# perpetrator role. The role-binder then prefers candidates whose computed
# motive set intersects the template's accepted motives.
#
# Clause grammar (inside a motive { ... } block):
#
#   require situation <flag>            single situation must be present
#   require situation any_of <a> <b>... at least one of these situations
#   require attitude_outgoing <kind>    npc has outgoing attitude of this kind
#   require emotion_recent <kind>       npc had this emotion within ~1 year
#   require trait <field> >= <N>        npc field meets numeric floor (0..255)
#   boost   situation <flag> +<n>       additional weight if flag present
#   boost   trait <field> >= <N> +<n>   additional weight if trait floor met
#
# Trait convention: 128 is the population average for u8 traits. By default
# `require trait X >= 128` (above average). Strength above average adds via
# `boost trait X >= 160 +1` and `boost trait X >= 200 +2`.
#
# Multiple `require` clauses are AND'd. A motive is *eligible* iff every
# require-clause is satisfied. `boost` clauses adjust a motive's strength
# above the default 1.0.
#
# Situation flags referenced below are expected to be set by
# vitals.cc::run_situation_pass on each npc; the situation vocabulary is
# defined alongside this file (situations.cfg, future).
# ----------------------------------------------------------------------------

# === SELF-ORIENTED (8) =======================================================

motive "survival" {
    require situation any_of starving destitute homeless
    boost   situation has_dependents +1
}

motive "material_gain" {
    require situation any_of poor in_debt financially_strained
}

motive "fear_of_loss" {
    require situation any_of business_failing reputation_threatened legacy_threatened
    boost   trait narcissism >= 160 +1
    boost   trait narcissism >= 200 +1
}

motive "face_saving" {
    require situation any_of publicly_humiliated reputation_threatened secret_at_risk
    boost   trait narcissism >= 160 +1
    boost   trait narcissism >= 200 +1
}

motive "silence_witness" {
    require situation witness_to_own_crime
}

motive "social_climbing" {
    require situation aspires_higher_class
    boost   trait machiavellianism >= 160 +1
    boost   trait narcissism      >= 160 +1
}

motive "thrill" {
    require trait psychopathy >= 128
    boost   trait psychopathy >= 160 +1
    boost   trait psychopathy >= 200 +2
    boost   trait sadism      >= 160 +1
}

motive "compulsion" {
    require trait psychopathy >= 128
    require trait sadism      >= 128
    boost   trait psychopathy >= 180 +1
    boost   trait psychopathy >= 220 +2
    boost   trait sadism      >= 180 +1
    boost   trait sadism      >= 220 +2
}

# === OTHER-ORIENTED (8) =====================================================

motive "family_preservation" {
    require situation has_dependents
    require situation any_of family_threatened starving in_debt
}

motive "mate_retention" {
    require situation married
    require situation any_of suspects_infidelity rival_courting_spouse
    boost   trait machiavellianism >= 160 +1
}

motive "mate_acquisition" {
    require attitude_outgoing infatuation
    require situation rival_blocks_courtship
}

motive "obsession" {
    require attitude_outgoing infatuation
    require trait psychopathy >= 128
    boost   trait psychopathy >= 180 +1
    boost   trait narcissism  >= 160 +1
}

motive "revenge" {
    require attitude_outgoing hate
    require situation was_wronged_by_target
}

motive "vendetta" {
    require situation family_was_wronged
    require attitude_outgoing hate
}

motive "domination" {
    require trait sadism >= 128
    boost   trait sadism      >= 180 +1
    boost   trait sadism      >= 220 +2
    boost   trait psychopathy >= 160 +1
}

motive "honor_defense" {
    require situation any_of publicly_insulted family_dishonored
}

# === TRANSCENDENT (2) ========================================================

motive "ideology" {
    require situation any_of class_resentful religious_zealot political_radical
}

motive "mercy" {
    require situation witness_to_suffering
    require emotion_recent compassion
}
