# ----------------------------------------------------------------------------
# population.cfg - founder families for the St-Revier 1700 historical sim.
#
# Loaded by Merlin/historical's setup.cc. Each family expands into:
#   - one family object (archetype="family") in Port Christie
#   - one npc per member, parented to the family
#   - world predicates: married_to(head, spouse),
#                       bio_parent_of(parent, child),
#                       lives_in(member, residence)
#
# Format (line-oriented, # for comments):
#
#   family <surname> <class> [<residence_id>]
#     head   <given_name> <gender> <age>
#     spouse <given_name> <gender> <age>
#     child  <given_name> <gender> <age>
#     ...
#
#   <class>          = lower | middle | upper
#   <gender>         = male | female
#   <age>            = years at sim start
#   <residence_id>   = friendly id of a building from build_port_christie:
#                      blackthorne_estate, ashworth_house, old_abbey,
#                      duval_townhouse, whitfield_townhouse, fishermans_row,
#                      harbour_dock, weaving_mill, town_chapel
#
# Note: ages are at start_year (default 1700). The sim back-computes
# birth_ym from <age>, so a head age 42 in 1700 means birth_ym = 1658-01.
# ----------------------------------------------------------------------------

